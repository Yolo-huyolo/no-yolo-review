kind: workspace
name: no-yolo-review
version: "0.1.0"
description: File layout and spec-to-code generation mapping for the no-yolo-review CLI package

structure:
  - path: src/cli.ts
    generated_from: review-diff.flow.yaml
    generate_with: node-cli-entrypoint
    # A single entrypoint: parse argv/optional .no-yolo-review.yml, run
    # review-diff, print review-report, exit 0/1 on review_report.blocked.
    # No --full/--fast switch — this package only ever runs the full
    # multi-persona pass; that's its entire reason to exist alongside
    # no-yolo-commits. Must not prompt interactively, since it's meant
    # to run unattended both from a terminal and, later, from inside a
    # `npx no-yolo-review` call made by a no-yolo-commits hook.
    # --all feeds review-diff-chunked the whole tracked-plus-not-gitignored
    # codebase, chunked (see src/repo-source.ts), instead of one
    # `git diff --cached` string. --html <path> additionally writes a
    # self-contained HTML report alongside the terminal one. When stdin is
    # piped (not a TTY) and --all isn't set, that piped text is the diff
    # instead of `git diff --cached` — e.g. a pre-push hook piping
    # `git diff <remote>..<local>` in, since --all doesn't scale to "review
    # what's about to be pushed" on anything past a small project, and
    # --cached is normally empty by push time. None of this changes
    # review-diff.flow.yaml itself — all of it is CLI-level: what string(s)
    # become staged_diff and how review_report gets rendered, not new flow
    # steps.

  - path: src/repo-source.ts
    generated_from: review-diff.flow.yaml
    generate_with: typescript-module
    # Not itself part of the flow — a --all-mode input source. Lists
    # tracked+untracked-not-gitignored files, drops lockfile noise, and
    # packs them into size-bounded chunks (packIntoChunks, pure and unit
    # tested directly) so each chunk stays well under
    # @kitana-sdk/core's ~120s hard CLI-kill ceiling. Whatever budget is
    # chosen here is empirical, not derived from a spec value — tune
    # DEFAULT_CHUNK_BUDGET_CHARS in code if real runs show it's off.

  - path: src/config/schema.ts
    generated_from: review-config.artifact.yaml
    generate_with: zod-schema
    # Also the source for persona.artifact.yaml's shape (personas is a
    # field of review-config).

  - path: src/config/load.ts
    generated_from: review-config.artifact.yaml
    generate_with: yaml-loader
    # Reads an optional .no-yolo-review.yml if present, validates
    # against schema.ts, merges CLI flags (--stack, --namer) and the
    # three built-in persona defaults for any enabled persona missing
    # `focus`. No config file at all is a fully valid, common case.

  - path: src/personas/registry.ts
    generated_from: persona.artifact.yaml
    generate_with: typescript-module
    # The three built-in presets (correctness, security, seo) as
    # exported constants — each a persona.artifact.yaml instance with
    # builtin: true and a hand-written focus string.

  - path: src/personas/correctness.ts
    generated_from: persona.artifact.yaml
    generate_with: typescript-module

  - path: src/personas/security.ts
    generated_from: persona.artifact.yaml
    generate_with: typescript-module

  - path: src/personas/seo.ts
    generated_from: persona.artifact.yaml
    generate_with: typescript-module
    # Must encode the request-time-lastmod-is-a-seo-finding scenario
    # from review-diff.behavior.yaml explicitly in its focus text —
    # that scenario exists precisely because a generic SEO prompt
    # missed it once already.

  - path: src/flows/review-diff.ts
    generated_from: review-diff.flow.yaml
    generate_with: adk-parallel-sequential-agent
    # fan-out-personas as an ADK ParallelAgent over active_personas,
    # aggregate-findings as a single following LlmAgent (ADK
    # SequentialAgent composition of the two).

  - path: src/policy/apply.ts
    generated_from: review-policy.yaml
    generate_with: typescript-module
    # Pure function: (raw_findings, config) -> findings. No LLM calls —
    # regex/keyword matching per rule, deterministic.

  - path: src/report.ts
    generated_from: review-report.artifact.yaml
    generate_with: typescript-module
    # Terminal-formatted printer + the review_report object itself.

  - path: test/behaviors/review-diff.test.ts
    generated_from: review-diff.behavior.yaml
    generate_with: vitest-behavior-suite
    # One test per scenario id — blocks-unsanitized-dangerously-set-inner-html
    # and request-time-lastmod-is-a-seo-finding reuse the exact two
    # fixtures already validated by hand on fairlab_landing.

  - path: .no-yolo-review.example.yml
    generated_from: review-config.artifact.yaml
    generate_with: yaml-example
    # Ships in the published package as an optional template — most
    # consuming repos won't need to copy this in at all.
