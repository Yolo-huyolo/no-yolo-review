kind: artifact
name: review-config
version: "0.1.0"
description: Optional configuration for a no-yolo-review run. Unlike no-yolo-commits, most projects need zero config — the three built-in personas (correctness, security, seo) cover the common case out of the box. This shape backs both CLI flags (for the common overrides) and an optional .no-yolo-review.yml (for persona customization a flag can't express cleanly).

fields:
  - name: stack
    type: string
    required: false
    description: "Free-text description of the project's stack (e.g., \"Next.js + TypeScript + Postgres\"), passed into every persona's prompt so findings are relevant instead of generic. Mirrors no-yolo-commits' --stack flag. Defaults to \"TypeScript\" when unset."

  - name: namer
    type: enum
    required: false
    values: [claude, codex, ollama]
    description: Which Kitana-routed CLI runs every persona's ADK agent. Defaults to claude.

  - name: personas
    type: array
    required: false
    description: List of persona artifacts (see persona.artifact.yaml). Defaults to the three built-in presets (correctness, security, seo), all enabled. Only needs to be set to disable a built-in persona or add a custom one — order does not affect the fan-out, since all run in parallel.

  - name: policy_overrides
    type: array
    required: false
    description: List of {match, severity} pairs — regex/keyword rules the aggregator applies after personas report, independent of what any single persona's model call decided. Additive to review-policy.yaml's built-in security-findings-always-block rule, not a replacement for it.
