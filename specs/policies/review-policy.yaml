kind: policy
name: review-policy
version: "0.1.0"
description: Execution rules for the review-diff flow — fail-open behavior, timeouts, and severity escalation independent of any single persona's own judgment. no-yolo-review only ever runs the full multi-persona pass; it has no fast mode of its own (that's no-yolo-commits' job) and no separate opt-in rule is needed since running it at all is already the opt-in.

rules:
  - id: fail-open-on-review-unavailable
    description: A review step that cannot complete (CLI missing, errors, exceeds timeout) must never be the sole reason the CLI exits as if blocked
    applies_to: review-diff
    condition: an ADK persona call (via Kitana) errors, times out, or the underlying provider CLI is not on PATH
    action: warn
    # "warn" here means: the step provides an empty/partial result and
    # review_report.degraded is set true, not that blocked becomes true.
    # Distinct from a persona reporting a real finding at severity:warn.
    # Before falling back, a single call gets one retry: real runs show
    # meaningful timing variance per call (CLI startup, provider-side load)
    # independent of input size — often just that one attempt being unlucky,
    # not a persistent unavailability. Still counts as "review unavailable"
    # for this rule once both attempts are exhausted.

  - id: persona-timeout
    description: A single persona's ADK agent turn (fan-out step) has its own budget, independent of the others. The budget scales with how much material that persona was handed (a large --all whole-repo review legitimately takes longer per persona than a normal diff) — a flat 90s was tried first and measured too short for a real --all run, capped so a truly stuck call still gets dropped
    applies_to: review-diff / fan-out-personas
    condition: elapsed > budget(material size) for one persona
    action: warn
    # That persona's result is dropped from persona_results; the other
    # personas' results still proceed to aggregation. One slow persona
    # must not stall the whole run.

  - id: security-findings-always-block
    description: Any finding whose summary matches a known high-severity category is escalated to block, regardless of the reporting persona's own severity_default
    applies_to: apply-policy-overrides
    condition: "finding.summary matches /xss|secret|credential|sql injection|ssrf/i"
    action: require-auth
    # Reusing "require-auth" as the closest existing policy action verb
    # for "escalate to block" — Architecto's action vocabulary doesn't
    # have a dedicated "escalate-severity" action. The generated code
    # implements this as: set finding.severity = block,
    # finding.escalated_by = "security-findings-always-block".

  - id: no-network-side-effects-during-review
    description: Persona and aggregator agents may only use read-only tools (Read, Grep, git diff/show/log) — never Write/Edit or a Bash invocation that isn't a read-only git subcommand
    applies_to: review-diff
    condition: always
    action: deny
