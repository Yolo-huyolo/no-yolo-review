kind: policy
name: review-policy
version: "0.1.0"
description: Execution rules for the review flows — fail-open behavior, timeouts, and severity escalation independent of any single persona's own judgment

rules:
  - id: fail-open-on-review-unavailable
    description: A review step that cannot complete (CLI missing, errors, exceeds timeout) must never be the sole reason a commit is blocked
    applies_to: review-diff, review-diff-fast
    condition: kitana CLI call errors, times out, or the underlying provider CLI is not on PATH
    action: warn
    # "warn" here means: the step provides an empty/partial result and
    # review_report.degraded is set true, not that the commit is
    # blocked. Distinct from a persona reporting a real finding at
    # severity:warn.

  - id: full-mode-is-opt-in
    description: The multi-persona fan-out/aggregate flow must never run as the default pre-commit gate
    applies_to: review-diff
    condition: review_config.mode == fast AND no --full flag on invocation
    action: deny
    # "deny" = this flow does not run at all in that condition;
    # review-diff-fast runs instead. Reflects the explicit decision
    # that per-commit latency for every local commit matters more than
    # the deeper multi-persona pass, which stays available on demand.

  - id: persona-timeout
    description: A single persona's ADK agent turn (fan-out step) has its own budget, independent of the others
    applies_to: review-diff / fan-out-personas
    condition: elapsed > 90s for one persona
    action: warn
    # That persona's result is dropped from persona_results; the other
    # personas' results still proceed to aggregation. One slow persona
    # must not stall the whole run.

  - id: security-findings-always-block
    description: Any finding whose summary matches a known high-severity category is escalated to block, regardless of the reporting persona's own severity_default
    applies_to: apply-policy-overrides
    condition: "finding.summary matches /xss|secret|credential|sql injection|ssrf/i"
    action: require-auth
    # Reusing "require-auth" as the closest existing policy action verb
    # for "escalate to block" — Architecto's action vocabulary doesn't
    # have a dedicated "escalate-severity" action. The generated code
    # implements this as: set finding.severity = block,
    # finding.escalated_by = "security-findings-always-block".

  - id: no-network-side-effects-during-review
    description: Persona and aggregator agents may only use read-only tools (Read, Grep, git diff/show/log) — never Write/Edit or a Bash invocation that isn't a read-only git subcommand
    applies_to: review-diff, review-diff-fast
    condition: always
    action: deny
