kind: behavior
name: review-diff
version: "0.1.0"
description: Acceptance scenarios for the review-diff flow. Several of these are direct writeups of real bugs caught (or, in one case, missed and then fixed) manually on fairlab_landing before this project existed — kept as permanent regression scenarios, not hypotheticals. no-yolo-review is a standalone CLI (run manually via `npx no-yolo-review`, or later invoked the same way from within a no-yolo-commits hook) — it does not touch branches or commits itself.

scenarios:
  - id: blocks-unsanitized-dangerously-set-inner-html
    given: A staged diff adds a page component that fetches an external URL, types the response as any, and renders a field from it via dangerouslySetInnerHTML with no sanitization
    when: review-diff runs
    then: The report contains a finding with severity block, persona security, describing the unsanitized HTML injection

  - id: clean-diff-produces-no-blocking-findings
    given: A staged diff that only fixes a typo in a comment
    when: review-diff runs
    then: review_report.blocked is false and findings is empty

  - id: fails-open-when-provider-cli-missing
    given: review_config.namer's CLI is not present on PATH
    when: review-diff runs
    then: review_report.degraded is true, review_report.blocked is false, and the run does not report as blocked solely because personas could not run

  - id: fails-open-on-persona-timeout
    given: One persona's ADK agent turn exceeds the persona-timeout budget in review-policy.yaml, while the other two personas complete normally
    when: review-diff runs
    then: "aggregate-findings still runs on the personas that did complete, and their findings make it into the report — the timeout does not abort the whole run or make it look empty. review_report.degraded IS still true, though: a persona genuinely didn't run, so the report genuinely is incomplete relative to a full pass. (An earlier version of this scenario claimed the opposite — that the report is 'not marked degraded' — which was simply wrong: review-policy.yaml's own fail-open-on-review-unavailable rule already says a persona timeout sets degraded true, and the code has always done that; only this scenario's wording, and a test that never asserted the degraded flag, disagreed. Caught by this project's own review-diff running on itself.)"

  - id: request-time-lastmod-is-a-seo-finding
    given: A staged diff adds a sitemap entry whose lastModified value is computed from the current request time (e.g. new Date()) rather than a stored content-edit date
    when: review-diff runs with the seo persona enabled
    then: The report contains a finding with persona seo describing that lastModified/dateModified must reflect a real, stable content-edit date, not request time
    # This scenario codifies a real miss: the first version of this
    # check (built by hand on fairlab_landing, before this project
    # existed) did not catch this pattern in three separate commits
    # that used new Date() for sitemap lastModified, because the
    # review prompt at the time only checked presence/structure (is it
    # in the sitemap, does structured data exist), not value
    # correctness. The prompt was corrected after a human caught it in
    # review. Any future persona prompt regressing on this exact
    # pattern is a regression, not a new bug.

  - id: disabled-persona-is-skipped-not-errored
    given: review_config.personas includes an entry with enabled false
    when: review-diff's load-personas step runs
    then: that persona does not appear in active_personas and does not produce a finding, and this is not treated as an error

  - id: runs-standalone-without-touching-git
    given: A developer runs `npx no-yolo-review` manually in a repo with staged changes, outside of any commit in progress
    when: the CLI completes
    then: "it exits 0 if review_report.blocked is false and 1 if true, and prints the report to stdout — no branch is created and no commit is touched, since branch management and the fast pre-commit gate stay no-yolo-commits' responsibility. The same exit-code contract holds when a future no-yolo-commits hook invokes `npx no-yolo-review` itself for an opt-in deep pass."
