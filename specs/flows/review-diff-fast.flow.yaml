kind: flow
name: review-diff-fast
version: "0.1.0"
description: Single-pass review (mode:fast) — one generalist call covering correctness + security + SEO in one prompt, no fan-out/aggregate. This is the default pre-commit gate; review-diff (full mode) is opt-in via CLI flag, never the default, because a real multi-persona run is too slow to block every local commit.

inputs:
  - staged_diff
  - review_config

outputs:
  - review_report

steps:
  - id: single-pass-review
    action: kitana.cli-call
    requires:
      - staged_diff
    provides:
      - raw_findings
    critical: false
    onError: warn
    # One call through review_config.namer (Kitana-routed). Prompt
    # covers all three built-in personas' concerns at once, at lower
    # depth than full mode. Same fail-open contract as full mode: if
    # the CLI is missing, errors, or exceeds the timeout in
    # review-policy.yaml, this step provides an empty raw_findings
    # rather than failing the flow.

  - id: apply-policy-overrides
    action: policy.apply
    requires:
      - raw_findings
    provides:
      - findings
    critical: true
    onError: fail

  - id: compose-report
    action: compose
    requires:
      - findings
    provides:
      - review_report
    critical: true
    onError: fail
