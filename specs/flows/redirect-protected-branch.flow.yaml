kind: flow
name: redirect-protected-branch
version: "0.1.0"
description: When a commit lands on a protected branch (main/master), redirect it onto a freshly-named branch instead of blocking it outright. Runs after review-diff/review-diff-fast — a blocked report exits before this flow ever starts.

inputs:
  - current_branch
  - staged_diff
  - review_config

outputs:
  - target_branch

steps:
  - id: check-protected
    action: branch.is-protected
    requires:
      - current_branch
      - review_config
    provides:
      - is_protected
    critical: true
    onError: fail

  - id: generate-slug
    action: kitana.cli-call
    requires:
      - staged_diff
      - review_config
      - is_protected
    provides:
      - slug
    critical: false
    onError: warn
    # requires is_protected purely as a gate: this step (and the rest of
    # the flow) only runs when it's true. Asks review_config.namer for an
    # 8-word-max kebab-case summary of staged_diff. Fail-open: on
    # timeout/error/missing CLI, provides a fallback slug
    # ("changes-<short-epoch>") instead of failing the flow — a broken
    # namer must never be the reason a commit can't land anywhere.

  - id: create-branch
    action: git.checkout-b
    requires:
      - slug
      - review_config
    provides:
      - target_branch
    critical: true
    onError: fail
    # target_branch = "<review_config.branch_prefix>-<unix_timestamp>-<slug>",
    # truncated to 100 chars. critical: true here is deliberate and
    # different from generate-slug above — a failure to actually create
    # the branch (e.g. name collision) must abort the commit with a
    # clear error, not silently continue on the protected branch.
