name: no-yolo-review
version: 0.1.0
description: Multi-persona AI code review for git pre-commit, built on Kitana + ADK

specs:
  directory: ./specs

  # Optional: validate specs on every save
  validateOnSave: false

  # Optional: which spec kinds to validate
  kinds:
    - flow
    - interface
    - artifact
    - policy
    - behavior
    - workspace

